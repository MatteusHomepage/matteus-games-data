name: Make questions

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: make-questions
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved lookups
        uses: actions/cache/restore@v4
        with:
          path: gen/cache
          key: lookups-${{ github.run_id }}
          restore-keys: lookups-

      - name: Make questions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "matteus-games-bot"
          git config user.email "bot@users.noreply.github.com"
          python gen/main.py run --minutes=325

      - name: Show how many questions each part has
        if: always()
        run: python gen/main.py stats

      - name: Clean old lookups
        if: always()
        run: find gen/cache -type f -mtime +30 -delete 2>/dev/null || true

      - name: Save lookups
        if: always()
        uses: actions/cache/save@v4
        with:
          path: gen/cache
          key: lookups-${{ github.run_id }}

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/generate.yml/enable" || true
